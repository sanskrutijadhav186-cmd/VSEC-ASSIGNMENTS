<!DOCTYPE html>
<html>

<head>
    <title>Four Box Animation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <input type="checkbox" id="click">

    <label for="click">

        <div class="boxarea">

            <div class="name">Keep Smiling</div>

            <div class="left">
                <div class="box blue"></div>
                <div class="box yellow"></div>
            </div>

            <div class="right">
                <div class="box red"></div>
                <div class="box green"></div>
            </div>

        </div>

    </label>

</body>

</html>
